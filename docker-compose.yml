version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: orvix_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: orvix_solutions

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: orvix_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/orvix_solutions
      - JWT_SECRET=change_this_to_a_secure_random_string_in_production
      - ADMIN_EMAIL=admin@orvix.com
      - ADMIN_PASSWORD=change_this_password_in_production
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: orvix_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
